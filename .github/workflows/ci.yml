name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  bot:
    name: Bot (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check mugetsu tests
      - run: pytest -q

  dashboard:
    name: Dashboard (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  image:
    # Pull requests: build the image and smoke-test it. master and v* tags: build and publish.
    name: Docker image
    needs: [bot, dashboard]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.PUBLISH == 'true' && steps.meta.outputs.tags || 'mugetsu:test' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        if: env.PUBLISH != 'true'
        run: |
          set -euo pipefail
          img=mugetsu:test

          echo "::group::Package, dashboard build and tools"
          docker run --rm "$img" python -c "import mugetsu.bot, mugetsu.web.app, mugetsu.web.demo; from mugetsu.config import Config; d = Config().dashboard_dist; assert (d / 'index.html').is_file(), d; print('package OK, dashboard at', d)"
          docker run --rm "$img" ffmpeg -hide_banner -version | head -1
          docker run --rm "$img" deno --version | head -1
          echo "::endgroup::"

          echo "::group::Starts and exits cleanly without a token"
          set +e; out=$(docker run --rm "$img" 2>&1); code=$?; set -e
          echo "$out"
          test "$code" -eq 1
          grep -q "DISCORD_BOT_TOKEN is not set" <<<"$out"
          echo "::endgroup::"

          echo "::group::Serves the built dashboard"
          cid=$(docker run -d "$img" python -m mugetsu.web.demo)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$cid" python -c "import urllib.request as u; assert b'id=\"root\"' in u.urlopen('http://127.0.0.1:8080/').read()" 2>/dev/null; then
              echo "Dashboard served from inside the image"
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
